    regex: '\.font\s*\(\s*\.headline\s*\)'
    match_kinds:
      - identifier
    message: "Replace .font(.headline) with .headline()"
    severity: warning
  screchkit_subheadline:
    name: "ScrechKit subheadline"
    regex: '\.font\s*\(\s*\.subheadline\s*\)'
    match_kinds:
      - identifier
    message: "Replace .font(.subheadline) with .subheadline()"
    severity: warning
  screchkit_callout:
    name: "ScrechKit callout"
    regex: '\.font\s*\(\s*\.callout\s*\)'
    match_kinds:
      - identifier
    message: "Replace .font(.callout) with .callout()"
    severity: warning
  screchkit_footnote:
    name: "ScrechKit footnote"
    regex: '\.font\s*\(\s*\.footnote\s*\)'
    match_kinds:
      - identifier
    message: "Replace .font(.footnote) with .footnote()"
    severity: warning
  screchkit_caption:
    name: "ScrechKit caption"
    regex: '\.font\s*\(\s*\.caption\s*\)'
    match_kinds:
      - identifier
    message: "Replace .font(.caption) with .caption()"
    severity: warning
  screchkit_caption2:
    name: "ScrechKit caption2"
    regex: '\.font\s*\(\s*\.caption2\s*\)'
    match_kinds:
      - identifier
    message: "Replace .font(.caption2) with .caption2()"
    severity: warning
