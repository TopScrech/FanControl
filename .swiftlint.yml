# Prefer ScrechKit's adaptive font modifiers
only_rules:
  - custom_rules

excluded:
  - .build
  - DerivedData
  - ThirdParty

custom_rules:
  screchkit_large_title:
    name: "ScrechKit largeTitle"
    regex: '\.font\s*\(\s*\.largeTitle\s*\)'
    match_kinds:
      - identifier
    message: "Replace .font(.largeTitle) with .largeTitle()"
    severity: warning
  screchkit_title:
    name: "ScrechKit title"
    regex: '\.font\s*\(\s*\.title\s*\)'
    match_kinds:
      - identifier
    message: "Replace .font(.title) with .title()"
    severity: warning
  screchkit_title2:
    name: "ScrechKit title2"
    regex: '\.font\s*\(\s*\.title2\s*\)'
    match_kinds:
      - identifier
    message: "Replace .font(.title2) with .title2()"
    severity: warning
  screchkit_title3:
    name: "ScrechKit title3"
    regex: '\.font\s*\(\s*\.title3\s*\)'
    match_kinds:
      - identifier
    message: "Replace .font(.title3) with .title3()"
    severity: warning
  screchkit_headline:
